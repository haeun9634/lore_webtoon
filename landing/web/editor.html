<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LORE 편집실 — 결과물 미리보기</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/editor.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖌️</text></svg>">
</head>
<body class="ed">

<!-- 머리 · 제목 띠 · 구운 결과를 한 덩어리로 붙박아 둔다. 따로 붙이면 아래
     줄의 top 값을 위 줄 높이에 손으로 맞춰야 해서 글꼴이 바뀔 때 어긋난다. -->
<header class="ed-top">
  <div class="ed-top-row">
    <a class="brand" href="/">
      <!-- 홈과 같은 로고다 — 편집실만 옛 "L" 배지로 남아 있었다. 여기도
           들어올 때마다 루의 표정이 바뀐다(editor.js 가 고른다). -->
      <span class="brand-mark" aria-hidden="true">
        <img id="brandLou" src="/static/lou/logo-2-default.png" alt="" width="30" height="30">
      </span>
      <span class="brand-name">LORE</span>
      <span class="brand-sub">편집실</span>
    </a>
    <!-- 크레딧은 **첫 줄**에 둔다. 아래 제목 띠에 있던 동안에는 제목·작품
         단추와 폭을 다투다가 폰에서 줄이 접혔고, 무엇보다 "얼마 남았나" 는
         그리기 전에 보는 값이라 맨 위가 맞다. 샘플 표시와 한 묶음인 것은
         그대로다 — 실제 작품을 열면 app 이 칩째로 지운다. -->
    <div class="ed-chips">
      <span class="mock-badge" title="작품을 고르기 전까지는 샘플입니다. 크레딧과 다시 그리기는 흉내만 냅니다.">샘플</span>
      <div class="credit" id="creditBox">
        <span class="credit-icon">◈</span>
        <span class="credit-num" id="creditNum">1,240</span>
        <span class="credit-unit">크레딧</span>
        <button type="button" class="credit-more" id="ledgerBtn">내역</button>
      </div>
    </div>
    <!-- 폰에서는 이 줄이 통째로 **화면 아래 단추줄**이 된다 (editor.css 의
         .ed-top-right 참고). 머리줄 하나에 로고·크레딧·단추 셋을 다 넣으면
         590px 가 필요한데 컬럼은 480px 이라, 「저장」과 「이미지로 뽑기」가
         화면 밖으로 밀려나 아예 안 보였다(실측). 넓은 화면에서만 머리에
         남는다. 도구 손잡이도 같은 줄에 들어와서, 폰에서는 네 단추가 엄지
         닿는 자리에 나란히 선다. -->
  </div>

  <div class="ed-strip">
    <button type="button" class="ed-works-toggle" id="worksToggle"
            aria-expanded="false" aria-controls="edWorks">
      <span aria-hidden="true">☰</span> 작품
    </button>

    <div class="ed-title">
      <b id="edTitle">—</b>
      <span id="edMeta"></span>
    </div>
  </div>

  <!-- 구운 결과. 몇 장을 구웠는지, 무엇이 빠졌는지, 어디서 받는지. -->
  <div class="bake-result" id="bakeResult" hidden></div>
</header>

<div class="ed-body">
  <!-- ============================================ 작품 목록 ============ -->
  <!-- 만들어 둔 웹툰 전부. 목록이 비어 있어도(아직 하나도 안 만든 사람) 자리를
       지운다 — 자리가 사라지면 "그런 기능이 없다"로 읽힌다. -->
  <aside class="ed-works" id="edWorks">
    <p class="ed-works-head">내 작품</p>
    <div id="worksList"></div>
  </aside>

  <!-- ============================================ 웹툰 스크롤 ========== -->
  <main class="ed-stage" id="stageCol">
    <div class="ed-stage-head">
      <p class="eyebrow" id="edGenre"></p>
      <!-- 제목은 여기서 바로 고친다. 전에는 결과 화면에서만 고칠 수 있어서,
           편집실에서 제목이 마음에 안 들면 나갔다 들어와야 했다.

           연필(✎)은 결과 화면과 **같은 모양·같은 자리**다. 글자만 눌러도
           고쳐지지만, 그것만으로는 고칠 수 있다는 것을 아무도 몰랐다. -->
      <div class="title-row">
        <h1 id="edEpisode" data-title-edit tabindex="0"
            title="눌러서 제목을 고칩니다">1화</h1>
        <button type="button" class="icon-btn" id="edTitleEditBtn"
                title="제목 고치기" aria-label="제목 고치기">✎</button>
      </div>
      <p class="ed-logline" id="edLogline"></p>
      <label class="mini-toggle">
        <input type="checkbox" id="showOverlay" checked>
        <span>내가 얹은 것 보기</span>
      </label>

        <!-- 단추줄은 **제목·설명 아래**다. 머리줄에 있던 것을 여기로 옮겼다 —
             결과 화면이 제목 밑에 단추를 두는 것과 같은 자리이고, 폰에서는
             이 줄이 그대로 화면 아래 고정 바가 된다(editor.css 의
             .ed-top-right). position:fixed 는 부모와 무관해서 옮겨도 그대로
             동작한다. -->
        <div class="ed-top-right">
        <!-- 도구 서랍 손잡이. position 이 화면 폭에 따라 바뀌므로(폰=이 줄의
             한 칸, PC=컬럼 오른쪽 가장자리에 붙는 fixed) DOM 위치는 여기 하나로
             둔다 — fixed 는 부모와 무관하게 뜬다. -->
        <button type="button" class="dock-open" id="dockOpen"
                aria-controls="edDock" aria-expanded="false">
          <span class="dock-open-icon" aria-hidden="true">☰</span>
          <span class="dock-open-label">도구</span>
        </button>
        <!-- 대사 스크립트. 완성본 화면(읽는 자리)에 있던 것을 여기로 옮겼다 —
             대사를 확인하는 것은 읽는 일이 아니라 **고치는 일** 옆에 있어야 한다.
             말풍선을 얹으면서 원래 대사가 무엇이었는지 보는 자리다. -->
        <button type="button" class="btn btn-quiet btn-sm" id="scriptBtn">대사</button>
        <button type="button" class="btn btn-quiet btn-sm" id="saveBtn">저장</button>
        <!-- 얹은 것을 진짜 그림에 굽는다. 여기까지 와야 가져갈 것이 생긴다 —
             이 단추가 없던 동안, 배치한 말풍선은 브라우저 밖으로 나갈 길이 없었다. -->
        <button type="button" class="btn btn-primary btn-sm" id="bakeBtn">이미지로 뽑기</button>
      </div>
    </div>

    <!-- 회차 고르개. 한 편뿐인 작품에서는 editor.js 가 통째로 감춘다. -->
    <div class="ep-tabs" id="edEpTabs" hidden></div>

    <div id="scenes"></div>

    <p class="ed-foot-note" id="edFootNote">여기까지가 1화입니다.</p>
  </main>

  <!-- ============================================ 도구 서랍 ============ -->
  <!-- 오른쪽에서 밀려 나오는 서랍. 예전에는 화면 아래에 붙어 있었는데, 그림을
       보면서 얹는 작업인데 화면 아래 절반을 늘 서랍이 차지하고 있었다. 지금은
       기본이 닫힘이고 오른쪽 ☰ 를 눌러야 열린다 — 그림이 먼저다. -->
  <!-- (손잡이는 머리줄의 .ed-top-right 안으로 옮겼다 — 위 주석 참고) -->
  <div class="dock-scrim" id="dockScrim" hidden></div>

  <aside class="ed-dock" id="edDock" aria-label="말풍선 · 스티커 · 효과음">
    <div class="dock-bar">
      <div class="dock-tabs" id="dockTabs">
        <button type="button" class="dock-tab is-on" data-tab="bubble">말풍선</button>
        <button type="button" class="dock-tab" data-tab="sticker">스티커</button>
        <button type="button" class="dock-tab" data-tab="sfx">효과음</button>
      </div>
      <button type="button" class="dock-fold" id="dockFold"
              aria-expanded="false" aria-controls="dockBody" aria-label="도구 닫기"></button>
    </div>

    <div class="dock-body" id="dockBody">
      <p class="dock-hint" id="dockHint">
        누르면 <b id="activeSceneLabel">1번째 장</b>에 올라갑니다 — 끌어서 옮기세요.
      </p>

      <div class="dock-grid" id="dockGrid"></div>

      <!-- 고른 요소를 고치는 자리는 여기가 아니라 **그림 위**다.
           전에는 이 서랍에 글자칸과 슬라이더가 있었다 — 고치려면 그림에서
           눈을 떼고 서랍을 봐야 했고, 말풍선이 그림 어디에 걸리는지 보면서
           맞출 수가 없었다. 서랍은 이제 넣는 자리(팔레트)만 한다.
           고치는 손잡이는 editor.js 의 paintProps() 가 그림 위에 띄운다. -->
      </div>

      <div class="dock-ledger" id="dockLedger" hidden>
        <div class="dock-props-head"><b>크레딧 사용 내역</b>
          <button type="button" class="icon-btn" id="ledgerClose" aria-label="닫기">✕</button></div>
        <ul id="ledgerList"><li class="ledger-empty">아직 쓴 크레딧이 없습니다.</li></ul>
      </div>
    </div>
  </aside>
</div>

<!-- ====================================== 다시 그리기 확인 창 ==========
     "다시 그리기"를 누르면 바로 굽지 않고 여기서 한 번 멈춘다. 한 장 굽는 데
     1~2분과 실제 생성 비용이 들어서, 잘못 눌러 나가는 것이 그냥 되돌리면 되는
     일이 아니다. 그리고 대부분은 **왜** 다시 그리는지를 여기서 처음 적는다 —
     장 밑의 피드백 칸을 미리 펴 두는 사람은 드물다.

     항목(칩)은 서버가 준다(/api/config 의 feedback_tags.scene). 화면에 베껴
     두면 pipeline.py 의 목록과 갈라진다. -->
<div class="ask" id="regenAsk" hidden>
  <div class="ask-box" role="dialog" aria-modal="true" aria-labelledby="regenAskTitle">
    <h2 id="regenAskTitle">다시 그리기</h2>
    <p class="ask-sub" id="regenAskSub"></p>

    <p class="fb-lead">무엇이 마음에 안 드나요?
      <small>안 골라도 됩니다</small></p>
    <div class="fb-tags" id="regenAskTags"></div>

    <label class="field">
      <span>더 하고 싶은 말 <small>비워도 됩니다</small></span>
      <textarea id="regenAskText" rows="3" maxlength="500"
        placeholder="예: 표정을 더 밝게 / 배경을 밤으로"></textarea>
    </label>

    <label class="check-line">
      <input type="checkbox" id="regenAskTextless">
      <span>말풍선 없이 그림만 <small>대사는 나중에 얹으세요</small></span>
    </label>

    <p class="ask-warn">실제로 다시 그립니다 — 1~2분과 생성 비용이 듭니다.</p>

    <div class="ask-actions">
      <button type="button" class="btn btn-quiet" id="regenAskCancel">취소</button>
      <button type="button" class="btn btn-primary" id="regenAskGo">다시 그리기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<div class="fly" id="fly" hidden></div>

<script src="/static/base.js"></script>
<script src="/static/lou-art.js"></script>
<script src="/static/editor.js"></script>

<aside class="script-panel" id="scriptPanel" hidden>
  <div class="script-head">
    <b>대사 스크립트</b>
    <button type="button" class="icon-btn" id="scriptClose" aria-label="닫기">✕</button>
  </div>
  <div class="script-body" id="scriptBody"></div>
</aside>
</body>
</html>
